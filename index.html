function getSeasonName(branchIdx) {
  if ([2, 3, 4].includes(branchIdx)) return "ฤดูใบไม้ผลิ";
  if ([5, 6, 7].includes(branchIdx)) return "ฤดูร้อน";
  if ([8, 9, 10].includes(branchIdx)) return "ฤดูใบไม้ร่วง";
  return "ฤดูหนาว";
}

// กฎกำลังธาตุประจำตัว (身强/身弱): ต้องได้ทั้ง "ฐานเดือนสนับสนุน" (得令)
// และ "ธาตุเดียวกัน + ธาตุที่เสริม" ต้องเกิน 4 ใน 8 จึงจะถือว่าธาตุประจำตัวแข็งแรง
function computeDayMasterStrength(pillars, counts, dmElement) {
  const monthBranchIdx = BRANCHES.indexOf(pillars[1].branch);
  const monthBranchElement = BRANCH_ELEMENT[monthBranchIdx];
  const seasonSupports = monthBranchElement === dmElement || monthBranchElement === GENERATOR_OF[dmElement];
  const supportTotal = counts[dmElement] + counts[GENERATOR_OF[dmElement]];
  const isStrong = seasonSupports && supportTotal > 4;

  return {
    seasonName: getSeasonName(monthBranchIdx),
    monthBranchElement,
    seasonSupports,
    supportTotal,
    isStrong,
    favorable: isStrong
      ? [
          { element: PRODUCES[dmElement], role: ROLE_TH.output, roleKey: "output" },
          { element: CONTROLS[dmElement], role: ROLE_TH.wealth, roleKey: "wealth" },
          { element: CONTROLLED_BY[dmElement], role: ROLE_TH.officer, roleKey: "officer" },
        ]
      : [
          { element: GENERATOR_OF[dmElement], role: ROLE_TH.resource, roleKey: "resource" },
          { element: dmElement, role: ROLE_TH.peer, roleKey: "peer" },
        ],
    unfavorable: isStrong
      ? [
          { element: dmElement, role: ROLE_TH.peer, roleKey: "peer" },
          { element: GENERATOR_OF[dmElement], role: ROLE_TH.resource, roleKey: "resource" },
        ]
      : [
          { element: PRODUCES[dmElement], role: ROLE_TH.output, roleKey: "output" },
          { element: CONTROLS[dmElement], role: ROLE_TH.wealth, roleKey: "wealth" },
          { element: CONTROLLED_BY[dmElement], role: ROLE_TH.officer, roleKey: "officer" },
        ],
  };
}

function checkPalaceRelations(transitBranchIdx, natalPillars) {
  const messages = [];
  natalPillars.forEach((p) => {
    const natalIdx = BRANCHES.indexOf(p.branch);
    if (isChong(transitBranchIdx, natalIdx)) {
      messages.push({ type: "chong", text: PALACE_MEANING_TH[p.label].chong });
    }
    if (isHe(transitBranchIdx, natalIdx)) {
      messages.push({ type: "he", text: PALACE_MEANING_TH[p.label].he });
    }
  });
  return messages;
}

function analyzeBranchRelations(pillars) {
  const items = pillars.map((p) => ({ label: p.label, idx: BRANCHES.indexOf(p.branch), char: p.branch }));
  const presentIdx = new Set(items.map((it) => it.idx));
  const activeIdx = new Set();

  const sanhe = [];
  SANHE_GROUPS.forEach((g) => {
    const matched = g.branches.filter((idx) => presentIdx.has(idx));
    if (matched.length >= 2) {
      matched.forEach((idx) => activeIdx.add(idx));
      sanhe.push({
        element: g.element,
        full: matched.length === 3,
        pillars: items.filter((it) => matched.includes(it.idx)),
      });
    }
  });

  const sanhui = [];
  SANHUI_GROUPS.forEach((g) => {
    const matched = g.branches.filter((idx) => presentIdx.has(idx));
    if (matched.length >= 2) {
      matched.forEach((idx) => activeIdx.add(idx));
      sanhui.push({
        element: g.element,
        season: g.season,
        full: matched.length === 3,
        pillars: items.filter((it) => matched.includes(it.idx)),
      });
    }
  });

  const sanxing = [];
  SANXING_GROUPS.forEach((g) => {
    const matched = g.branches.filter((idx) => presentIdx.has(idx));
    const needed = g.type === "pair" ? 2 : 2;
    if (matched.length >= needed) {
      matched.forEach((idx) => activeIdx.add(idx));
      sanxing.push({
        name: g.name,
        meaning: g.meaning,
        full: matched.length === g.branches.length,
        pillars: items.filter((it) => matched.includes(it.idx)),
      });
    }
  });

  SELF_PUNISH_BRANCHES.forEach((idx) => {
    const occurrences = items.filter((it) => it.idx === idx);
    if (occurrences.length >= 2) {
      activeIdx.add(idx);
      sanxing.push({
        name: `自刑 ขัดแย้งในตัวเอง (${BRANCHES[idx]}${BRANCHES[idx]})`,
        meaning: SELF_PUNISH_MEANING,
        full: true,
        pillars: occurrences,
      });
    }
  });

  const unrelated = items.filter((it) => !activeIdx.has(it.idx));

  return { sanhe, sanhui, sanxing, unrelated };
}

// รูปดวงพิเศษ (特殊格局) แบบง่าย: ใช้เมื่อธาตุประจำตัวแข็งหรืออ่อนสุดขั้วจนหลักการปกติใช้ไม่ได้
function computeSpecialPattern(pillars, counts, dmElement, sanheHits, sanhuiHits) {
  const supportTotal = counts[dmElement] + counts[GENERATOR_OF[dmElement]];

  const fullMatchOwnElement = [...sanheHits, ...sanhuiHits].find((g) => g.full && g.element === dmElement);

  if (fullMatchOwnElement && supportTotal >= 5) {
    const p = DOMINANT_PATTERN_TH[dmElement];
    return {
      type: "dominant",
      title: p.title,
      desc: p.desc,
      meaning: `เนื่องจากมีนักษัตรประสานกันเต็มรูปในธาตุ${ELEMENT_TH[dmElement]}ซึ่งตรงกับธาตุประจำตัวเอง บวกกับแรงหนุนโดยรวมที่สูง (${supportTotal} จาก 8) พลังธาตุนี้จึงแข็งแกร่งมากเป็นพิเศษจนหลักการปกติใช้ไม่ได้เต็มที่ ในกรณีนี้ควรปล่อยให้พลังธาตุไหลไปตามธรรมชาติ ไม่ควรฝืนด้วยธาตุที่ควบคุมหรือระบายออกมากเกินไป`,

  }

  if (supportTotal >= 7) {
    return {
      type: "followStrong",
      title: "從旺格 (Cóngwàng Gé)",
      desc: "รูปดวงตามพลังที่รุ่งเรือง",
      meaning: `ธาตุประจำตัวได้รับแรงหนุนจากธาตุเดียวกันและธาตุที่เสริมพลังอย่างท่วมท้นเกือบทั้งดวง (${supportTotal} จาก 8) จนแทบไม่มีธาตุใดควบคุมได้ไหว หลักการปกติที่ต้องหาธาตุมาระบายพลังจะกลับกลายเป็นโทษ ควรปล่อยตามพลังที่ท่วมท้นนี้แทน`,
      favorable: [
        { element: GENERATOR_OF[dmElement], role: ROLE_TH.resource, roleKey: "resource" },
        { element: dmElement, role: ROLE_TH.peer, roleKey: "peer" },
        { element: PRODUCES[dmElement], role: ROLE_TH.output, roleKey: "output" },
      ],
      unfavorable: [
        { element: CONTROLS[dmElement], role: ROLE_TH.wealth, roleKey: "wealth" },
        { element: CONTROLLED_BY[dmElement], role: ROLE_TH.officer, roleKey: "officer" },
      ],
    };
  }

  if (supportTotal <= 1) {
    return {
      type: "followWeak",
      title: "從弱格 (Cóngruò Gé)",
      desc: "รูปดวงตามพลังที่อ่อนแรง",
      meaning: `ธาตุประจำตัวอ่อนแรงมาก (มีแรงหนุนเพียง ${supportTotal} จาก 8) ขณะที่ธาตุอื่นรุมล้อมอย่างท่วมท้น การพยายามหาธาตุมาเสริมธาตุประจำตัวจะยิ่งขัดกับกระแสหลักของดวง ควรปล่อยตามธาตุที่ท่วมท้นแทนการฝืนเสริมธาตุประจำตัว`,
      favorable: [
        { element: PRODUCES[dmElement], role: ROLE_TH.output, roleKey: "output" },
        { element: CONTROLS[dmElement], role: ROLE_TH.wealth, roleKey: "wealth" },
        { element: CONTROLLED_BY[dmElement], role: ROLE_TH.officer, roleKey: "officer" },
      ],
      unfavorable: [
        { element: dmElement, role: ROLE_TH.peer, roleKey: "peer" },
        { element: GENERATOR_OF[dmElement], role: ROLE_TH.resource, roleKey: "resource" },
      ],
    };
  }

  return null;
}

function supportLevel(counts, dmElement) {
  const total = counts[dmElement] + counts[GENERATOR_OF[dmElement]];
  if (total >= 5) return { label: "ได้รับการหนุนธาตุดี", detail: "มีธาตุอื่นในดวงหลายตัวช่วยเสริมพลัง ทำให้ธาตุประจำตัวแสดงออกมาอย่างมั่นคงและหนักแน่น" };
  if (total >= 3) return { label: "ได้รับการหนุนธาตุปานกลาง", detail: "มีความสมดุลระหว่างแรงหนุนและแรงท้าทายจากส่วนอื่นของดวงพอสมควร" };
  return { label: "ธาตุประจำตัวค่อนข้างบอบบาง", detail: "ธาตุประจำตัวพึ่งพาสถานการณ์ภายนอกและความสัมพันธ์รอบตัวมากกว่าปกติ" };
}

const mod = (n, m) => ((n % m) + m) % m;

// วัยจร 10 ปี (大运 Da Yun) — ทิศทางเดินหน้า/ถอยหลังตามเพศและขั้ว ปี, อายุเริ่มวัยจรประมาณจากระยะวันถึงจุดเปลี่ยนฤดูใกล้ที่สุด
function computeLuckPillars(dateStr, gender, pillars, count = 8) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  const yearStemIdx = STEMS.indexOf(pillars[0].stem);
  const monthStemIdx = STEMS.indexOf(pillars[1].stem);
  const monthBranchIdx = BRANCHES.indexOf(pillars[1].branch);

  const isYearStemYang = yearStemIdx % 2 === 0;
  const forward = (gender === "male") === isYearStemYang;

  const birthDate = new Date(y, mo - 1, d);
  const thisMonthBoundary = new Date(y, mo - 1, 5);
  let prevBoundary, nextBoundary;
  if (d < 5) {
    prevBoundary = new Date(y, mo - 2, 5);
    nextBoundary = thisMonthBoundary;
  } else {
    prevBoundary = thisMonthBoundary;
    nextBoundary = new Date(y, mo, 5);
  }
  const daysToNext = (nextBoundary - birthDate) / 86400000;
  const daysToPrev = (birthDate - prevBoundary) / 86400000;
  const startingAgeYears = Math.max(0, (forward ? daysToNext : daysToPrev) / 3);

  const periods = [];
  for (let n = 1; n <= count; n++) {
    const stemIdx = mod(monthStemIdx + (forward ? n : -n), 10);
    const branchIdx = mod(monthBranchIdx + (forward ? n : -n), 12);
    const ageStart = startingAgeYears + (n - 1) * 10;
    periods.push({
      ageStart,
      ageEnd: ageStart + 10,
      stem: STEMS[stemIdx],
      stemPinyin: STEM_PINYIN[stemIdx],
      stemElement: STEM_ELEMENT[stemIdx],
      branch: BRANCHES[branchIdx],
      branchPinyin: BRANCH_PINYIN[branchIdx],
      branchElement: BRANCH_ELEMENT[branchIdx],
      branchIdx,
    });
  }

  return { forward, startingAgeYears, periods };
}

function analyzeLuckPeriodSigns(period, natalBranchIdxSet, favSource, unfavSource, natalPillars) {
  const favMap = Object.fromEntries(favSource.map((f) => [f.element, f.roleKey]));
  const unfavMap = Object.fromEntries(unfavSource.map((f) => [f.element, f.roleKey]));
  const good = [];
  const bad = [];

  const describeElement = (element, char, position) => {
    if (favMap[element]) {
      good.push(`เสา${position} ${char} (${ELEMENT_TH[element]}) เป็นคุณ — ${ROLE_GOOD_TH[favMap[element]]}`);
    } else if (unfavMap[element]) {
      bad.push(`เสา${position} ${char} (${ELEMENT_TH[element]}) ควรระวังเรื่อง${ROLE_CAUTION_TH[unfavMap[element]]}`);
    }
  };

  describeElement(period.stemElement, period.stem, "บน");
  describeElement(period.branchElement, period.branch, "ล่าง");

  [...SANHE_GROUPS, ...SANHUI_GROUPS].forEach((g) => {
    if (g.branches.includes(period.branchIdx)) {
      const matched = g.branches.filter((idx) => natalBranchIdxSet.has(idx) || idx === period.branchIdx);
      if (matched.length >= 2) {
        if (favMap[g.element]) {
          good.push(`นักษัตร${period.branch}ไปประสานกับนักษัตรเดิมในดวง เสริมธาตุ${ELEMENT_TH[g.element]} — ${ROLE_GOOD_TH[favMap[g.element]]}`);
        } else if (unfavMap[g.element]) {
          bad.push(`นักษัตร${period.branch}ไปประสานกับนักษัตรเดิมในดวง เสริมธาตุ${ELEMENT_TH[g.element]}ที่ควรระวัง — ${ROLE_CAUTION_TH[unfavMap[g.element]]}`);
        }
      }
    }
  });

  SANXING_GROUPS.forEach((g) => {
    if (g.branches.includes(period.branchIdx)) {
      const matched = g.branches.filter((idx) => natalBranchIdxSet.has(idx) || idx === period.branchIdx);
      if (matched.length >= 2) {
        bad.push(`นักษัตร${period.branch}เข้า 刑 (ขัดแย้ง) กับนักษัตรเดิมในดวงแบบ "${g.name}" — ${g.meaning}`);
      }
    }
  });
  if (SELF_PUNISH_BRANCHES.includes(period.branchIdx) && natalBranchIdxSet.has(period.branchIdx)) {
    bad.push(`นักษัตร${period.branch}ซ้ำกับนักษัตรเดิมในดวง เกิด 自刑 (ขัดแย้งในตัวเอง) — ${SELF_PUNISH_MEANING}`);
  }

  if (natalPillars) {
    checkPalaceRelations(period.branchIdx, natalPillars).forEach((m) => {
      if (m.type === "chong") bad.push(m.text);
      else good.push(m.text);
    });
  }

  return { good, bad };
}

// ปีจร (流年 Liu Nian) — วิเคราะห์รายปีภายในวัยจรแต่ละช่วง เทียบธาตุปีนั้นกับดวงเดิมและวัยจรที่ครอบอยู่
const YEAR_DOMAIN_ROLE_MAP = {
  finance: ["wealth"],
  career: ["officer", "output"],
  family: ["resource", "peer", "output"],
  relationships: ["peer"],
};
const YEAR_DOMAIN_TITLES = { finance: "การเงิน", career: "การงาน", family: "ครอบครัว", relationships: "ความสัมพันธ์", love: "ความรัก", health: "สุขภาพ" };

function computeYearDomainNotes(stemElement, branchElement, favMap, unfavMap, gender, health) {
  const loveRoleKey = gender === "female" ? "officer" : "wealth";
  const domainRoleMap = { ...YEAR_DOMAIN_ROLE_MAP, love: [loveRoleKey] };

  const notes = {};
  Object.entries(domainRoleMap).forEach(([domainKey, roleKeys]) => {
    const lines = [];
    [stemElement, branchElement].forEach((el) => {
      roleKeys.forEach((rk) => {
        if (favMap[el] === rk) lines.push(DOMAIN_ROLE_TEXT[domainKey][rk].good);
        else if (unfavMap[el] === rk) lines.push(DOMAIN_ROLE_TEXT[domainKey][rk].bad);
      });
    });
    notes[domainKey] = [...new Set(lines)];
  });

  const healthLines = [];
  if (stemElement === health.weakest || branchElement === health.weakest) {
    healthLines.push(`ปีนี้มีธาตุ${ELEMENT_TH[health.weakest]}มาเสริม ช่วยดูแลระบบ${ELEMENT_ORGAN_TH[health.weakest]}ให้ดีขึ้นกว่าปกติ`);
  }
  if (health.strongestCount >= 4 && (stemElement === health.strongest || branchElement === health.strongest)) {
    healthLines.push(`ธาตุ${ELEMENT_TH[health.strongest]}ที่เด่นอยู่แล้วในดวงมาซ้ำอีกในปีนี้ ระบบ${ELEMENT_ORGAN_TH[health.strongest]}อาจทำงานหนัก ควรหมั่นดูแลเป็นพิเศษ`);
  }
  const attacker = CONTROLLED_BY[health.weakest];
  if (stemElement === attacker || branchElement === attacker) {
    healthLines.push(`ธาตุที่มาในปีนี้ข่มธาตุ${ELEMENT_TH[health.weakest]}ที่บอบบางอยู่แล้วในดวง ควรดูแลระบบ${ELEMENT_ORGAN_TH[health.weakest]}เป็นพิเศษในปีนี้`);
  }
  notes.health = healthLines;

  return notes;
}

function computeLiuNianYears(period, birthYear, natalBranchIdxSet, favSource, unfavSource, counts, gender, pillars) {
  const favMap = Object.fromEntries(favSource.map((f) => [f.element, f.roleKey]));
  const unfavMap = Object.fromEntries(unfavSource.map((f) => [f.element, f.roleKey]));
  const comboSet = new Set([...natalBranchIdxSet, period.branchIdx]);
  const health = analyzeNatalHealth(counts);

  const startAge = Math.round(period.ageStart);
  const years = [];

  for (let i = 0; i < 10; i++) {
    const age = startAge + i;
    const calendarYear = birthYear + age;
    const yearStemIdx = mod(calendarYear - 4, 10);
    const yearBranchIdx = mod(calendarYear - 4, 12);
    const stem = STEMS[yearStemIdx];
    const branch = BRANCHES[yearBranchIdx];
    const stemElement = STEM_ELEMENT[yearStemIdx];
    const branchElement = BRANCH_ELEMENT[yearBranchIdx];

    const good = [];
    const bad = [];
    let score = 0;

    const describe = (element, char, position) => {
      if (favMap[element]) {
        good.push(`เสา${position} ${char} (${ELEMENT_TH[element]}) เป็นคุณ — ${ROLE_GOOD_TH[favMap[element]]}`);
        score += 1;
      } else if (unfavMap[element]) {
        bad.push(`เสา${position} ${char} (${ELEMENT_TH[element]}) ควรระวังเรื่อง${ROLE_CAUTION_TH[unfavMap[element]]}`);
        score -= 1;
      }
    };
    describe(stemElement, stem, "บน");
    describe(branchElement, branch, "ล่าง");

    [...SANHE_GROUPS, ...SANHUI_GROUPS].forEach((g) => {
      if (g.branches.includes(yearBranchIdx)) {
        const matched = g.branches.filter((idx) => comboSet.has(idx) || idx === yearBranchIdx);
        if (matched.length >= 2) {
          if (favMap[g.element]) {
            good.push(`ปีนี้ (${branch}) ประสานกับดวงและวัยจร เสริมธาตุ${ELEMENT_TH[g.element]}`);
            score += 1;
          } else if (unfavMap[g.element]) {
            bad.push(`ปีนี้ (${branch}) ประสานเสริมธาตุ${ELEMENT_TH[g.element]}ที่ควรระวัง`);
            score -= 1;
          }
        }
      }
    });

    SANXING_GROUPS.forEach((g) => {
      if (g.branches.includes(yearBranchIdx)) {
        const matched = g.branches.filter((idx) => comboSet.has(idx) || idx === yearBranchIdx);
        if (matched.length >= 2) {
          bad.push(`ปีนี้ (${branch}) เข้า 刑 (ขัดแย้ง) กับดวง/วัยจรแบบ "${g.name}" — ${g.meaning}`);
          score -= 1;
        }
      }
    });
    if (SELF_PUNISH_BRANCHES.includes(yearBranchIdx) && comboSet.has(yearBranchIdx)) {
      bad.push(`ปีนี้ (${branch}) ซ้ำนักษัตรเดิม เกิด 自刑 (ขัดแย้งในตัวเอง) — ${SELF_PUNISH_MEANING}`);
      score -= 1;
    }

    if (pillars) {
      checkPalaceRelations(yearBranchIdx, pillars).forEach((m) => {
        if (m.type === "chong") {
          bad.push(m.text);
          score -= 1;
        } else {
          good.push(m.text);
          score += 1;
        }
      });
    }

    let verdict, verdictColor;
    if (score >= 3) { verdict = "ปีทอง"; verdictColor = "#FFD86B"; }
    else if (score === 2) { verdict = "ปีดี"; verdictColor = "#8FE39A"; }
    else if (score >= 0) { verdict = "ปีปานกลาง"; verdictColor = COLOR.muted; }
    else if (score === -1) { verdict = "ปีที่ต้องระวัง"; verdictColor = "#F0B45C"; }
    else { verdict = "ปีท้าทาย"; verdictColor = "#F0958C"; }

    const domains = computeYearDomainNotes(stemElement, branchElement, favMap, unfavMap, gender, health);
    years.push({ age, calendarYear, stem, branch, stemElement, branchElement, good, bad, verdict, verdictColor, domains });
  }

  return years;
}

// ---------- Precise solar term (節氣) calculation ----------
// สูตรตำแหน่งดวงอาทิตย์แบบ Meeus (ความแม่นยำ ~0.01 องศา) ใช้หาจุดเปลี่ยนฤดู/เดือนจริงตามหลักดาราศาสตร์
function toJulianDate(dateMs) {
  return dateMs / 86400000 + 2440587.5;
}

function mod360(x) {
  return ((x % 360) + 360) % 360;
}

function solarLongitudeDeg(dateMs) {
  const JD = toJulianDate(dateMs);
  const T = (JD - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const Mrad = (M * Math.PI) / 180;
  const C =
    (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad) +
    (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad) +
    0.000289 * Math.sin(3 * Mrad);
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136 * T;
  const apparentLong = trueLong - 0.00569 - 0.00478 * Math.sin((omega * Math.PI) / 180);
  return mod360(apparentLong);
}

function angleDiff(targetDeg, currentDeg) {
  let d = targetDeg - currentDeg;
  d = (((d + 180) % 360) + 360) % 360 - 180;
  return d;
}

// 12 "จี้" (節) ที่กำหนดจุดเริ่มต้นของแต่ละเดือนสุริยคติ พร้อมนักษัตรที่เริ่มต้น ณ จุดนั้น
const JIE_TERMS = [
  { deg: 285, month: 1, day: 6, branch: 1 }, // 小寒 -> 丑
  { deg: 315, month: 2, day: 4, branch: 2 }, // 立春 -> 寅
  { deg: 345, month: 3, day: 6, branch: 3 }, // 惊蛰 -> 卯
  { deg: 15, month: 4, day: 5, branch: 4 }, // 清明 -> 辰
  { deg: 45, month: 5, day: 6, branch: 5 }, // 立夏 -> 巳
  { deg: 75, month: 6, day: 6, branch: 6 }, // 芒种 -> 午
  { deg: 105, month: 7, day: 7, branch: 7 }, // 小暑 -> 未
  { deg: 135, month: 8, day: 8, branch: 8 }, // 立秋 -> 申
  { deg: 165, month: 9, day: 8, branch: 9 }, // 白露 -> 酉
  { deg: 195, month: 10, day: 8, branch: 10 }, // 寒露 -> 戌
  { deg: 225, month: 11, day: 7, branch: 11 }, // 立冬 -> 亥
  { deg: 255, month: 12, day: 7, branch: 0 }, // 大雪 -> 子
];

function findJieDateMs(year, targetDeg, approxMonth, approxDay) {
  let lo = Date.UTC(year, approxMonth - 1, approxDay - 5);
  let hi = Date.UTC(year, approxMonth - 1, approxDay + 5);
  let loDiff = angleDiff(targetDeg, solarLongitudeDeg(lo));
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    const midDiff = angleDiff(targetDeg, solarLongitudeDeg(mid));
    if ((loDiff > 0 && midDiff > 0) || (loDiff < 0 && midDiff < 0)) {
      lo = mid;
      loDiff = midDiff;
    } else {
      hi = mid;
    }
  }
  return (lo + hi) / 2;
}

function getLichunMs(year) {
  return findJieDateMs(year, 315, 2, 4);
}

// หาว่าเวลาเกิด (ms) อยู่ในช่วงเดือนสุริยคติที่เริ่มจากจี้ใด คืนค่านักษัตรของเดือนนั้น
function getMonthBranchAtTime(ms) {
  const year = new Date(ms).getUTCFullYear();
  const terms = [];
  [year - 1, year, year + 1].forEach((yr) => {
    JIE_TERMS.forEach((t) => {
      terms.push({ ms: findJieDateMs(yr, t.deg, t.month, t.day), branch: t.branch });
    });
  });
  terms.sort((a, b) => a.ms - b.ms);
  let result = terms[0];
  for (const t of terms) {
    if (t.ms <= ms) result = t;
    else break;
  }
  return result.branch;
}


function computePillars(dateStr, timeStr) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  const [h, min] = timeStr.split(":").map(Number);
  const birthMs = Date.UTC(y, mo - 1, d, h, min || 0);

  // เสาปี: ใช้จุดลี่ชุน (立春) ที่แม่นยำจริงของปีนั้นเป็นจุดตัด แทนการประมาณ 4 ก.พ.
  const lichunThisYear = getLichunMs(y);
  const baziYear = birthMs < lichunThisYear ? y - 1 : y;
  const yearStemIdx = mod(baziYear - 4, 10);
  const yearBranchIdx = mod(baziYear - 4, 12);

  // เสาเดือน: หาจากจี้ (節) ที่แม่นยำจริง ณ เวลาเกิด แทนการประมาณวันที่ 5 ของเดือน
  const monthBranchIdx = getMonthBranchAtTime(birthMs);
  const yearGroup = mod(yearStemIdx, 5);
  const monthStartStem = mod(2 + yearGroup * 2, 10);
  const lunarOffset = mod(monthBranchIdx - 2, 12);
  const monthStemIdx = mod(monthStartStem + lunarOffset, 10);

  const target = Date.UTC(y, mo - 1, d, 12);
  const ref = Date.UTC(2000, 0, 1, 12);
  const diffDays = Math.round((target - ref) / 86400000);
  const dayStemIdx = mod(4 + diffDays, 10);
  const dayBranchIdx = mod(6 + diffDays, 12);

  const hourBranchIdx = mod(Math.floor((h + 1) / 2), 12);
  const dayGroup = mod(dayStemIdx, 5);
  const hourStartStem = mod(dayGroup * 2, 10);
  const hourStemIdx = mod(hourStartStem + hourBranchIdx, 10);

  const pillar = (stemIdx, branchIdx, label) => ({
    label,
    stem: STEMS[stemIdx],
    stemPinyin: STEM_PINYIN[stemIdx],
    stemElement: STEM_ELEMENT[stemIdx],
    branch: BRANCHES[branchIdx],
    branchPinyin: BRANCH_PINYIN[branchIdx],
    branchElement: BRANCH_ELEMENT[branchIdx],
    animal: BRANCH_ANIMAL_TH[branchIdx],
  });

  const pillars = [
    pillar(yearStemIdx, yearBranchIdx, "ปี"),
    pillar(monthStemIdx, monthBranchIdx, "เดือน"),
    pillar(dayStemIdx, dayBranchIdx, "วัน"),
    pillar(hourStemIdx, hourBranchIdx, "ยาม"),
  ];

  const counts = { Wood: 0, Fire: 0, Earth: 0, Metal: 0, Water: 0 };
  pillars.forEach((p) => {
    counts[p.stemElement]++;
    counts[p.branchElement]++;
  });

  return { pillars, counts, dayMaster: pillars[2], dayStemIdx };
}

      </p>

  );
}

function analyzeNatalHealth(counts) {
  const entries = Object.entries(counts);
  const weakest = entries.reduce((min, e) => (e[1] < min[1] ? e : min), entries[0]);
  const strongest = entries.reduce((max, e) => (e[1] > max[1] ? e : max), entries[0]);
  const lines = [];
  lines.push(
    `ธาตุ${ELEMENT_ZH[weakest[0]]} ${ELEMENT_TH[weakest[0]]}ปรากฏน้อยที่สุดในดวง (${weakest[1]} จาก 8) จุดที่ควรดูแลเป็นพิเศษคือระบบ${ELEMENT_ORGAN_TH[weakest[0]]}`
  );
  if (strongest[1] >= 4 && strongest[0] !== weakest[0]) {
    lines.push(
      `ธาตุ${ELEMENT_ZH[strongest[0]]} ${ELEMENT_TH[strongest[0]]}โดดเด่นมากในดวง (${strongest[1]} จาก 8) ระบบ${ELEMENT_ORGAN_TH[strongest[0]]}อาจทำงานหนักหรือไวต่อการอักเสบ ควรหมั่นดูแลเป็นพิเศษเช่นกัน`
    );
  }
  return { weakest: weakest[0], weakestCount: weakest[1], strongest: strongest[0], strongestCount: strongest[1], lines };
}

function SeasonStrength({ pillars, counts, dayMaster }) {

  const s = computeDayMasterStrength(pillars, counts, dmElement);
  const monthPillar = pillars[1];

  const strongColor = "#8FE39A";
  const weakColor = "#F0958C";
  const verdictColor = s.isStrong ? strongColor : weakColor;

  return (
    <div className="relative px-6 py-8 sm:px-10 sm:py-10" style={cardStyle}>
      <p style={label}>ฤดูเกิดและกำลังธาตุประจำตัว</p>
      <h3 className="mt-2 text-xl font-bold sm:text-2xl" style={{ color: COLOR.heading, fontFamily: "'Noto Serif Thai', serif" }}>
        เกิดใน{s.seasonName} ธาตุประจำตัว
        <span style={{ color: verdictColor }}> {s.isStrong ? "แข็งแรง" : "อ่อนแอ"}</span>
      </h3>

      <div className="mt-5 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div className="p-4 rounded-sm" style={{ backgroundColor: "rgba(0,0,0,0.35)", border: `1px solid ${COLOR.cardBorder}` }}>
          <p style={{ fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.15em", color: COLOR.gold, fontWeight: 600 }}>
            ฐานเดือน (得令)
          </p>
          <p className="mt-2 text-sm" style={bodyText}>
            เสาเดือน {monthPillar.stem}{monthPillar.branch} มีธาตุ{" "}
            <span style={{ color: ELEMENT_COLOR[s.monthBranchElement] }} className="font-bold">
              {ELEMENT_ZH[s.monthBranchElement]} {ELEMENT_TH[s.monthBranchElement]}
            </span>{" "}
            ซึ่ง{s.seasonSupports ? "ส่งเสริม" : "ไม่ส่งเสริม"}ธาตุประจำตัว ({ELEMENT_TH[dmElement]})
          </p>
        </div>
        <div className="p-4 rounded-sm" style={{ backgroundColor: "rgba(0,0,0,0.35)", border: `1px solid ${COLOR.cardBorder}` }}>
          <p style={{ fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.15em", color: COLOR.gold, fontWeight: 600 }}>
            แรงหนุนรวมในดวง
          </p>
          <p className="mt-2 text-sm" style={bodyText}>
            ธาตุ{ELEMENT_TH[dmElement]}และธาตุที่เสริมกัน ({ELEMENT_TH[dmElement]} + {ELEMENT_TH[GENERATOR_OF[dmElement]]})
            รวมปรากฏ <span className="font-bold" style={{ color: COLOR.heading }}>{s.supportTotal} จาก 8</span> ตัวอักษร
          </p>
        </div>
      </div>

      <p className="mt-6 text-sm" style={bodyText}>
        {s.isStrong ? (
          <>
            เมื่อธาตุประจำตัวได้ทั้งกำลังจากฤดูเกิดและแรงหนุนจากธาตุอื่นในดวงเกินครึ่ง ถือว่า
            <span className="font-bold" style={{ color: strongColor }}> ธาตุประจำตัวแข็งแรง </span>
            เจ้าชะตามีพลังภายในเหลือเฟือ เหมาะกับการนำพลังนั้นไปใช้ผ่านการลงมือทำ การแสดงออก การสร้างผลงานหรือทรัพย์สิน
            หรือรับบทบาทที่ต้องใช้อำนาจและความรับผิดชอบ มากกว่าจะพึ่งพาแรงหนุนเพิ่มเติมอีก
          </>
        ) : (
          <>
            เมื่อฐานเดือนไม่ส่งเสริม หรือแรงหนุนในดวงยังไม่ถึงครึ่ง ถือว่า
            <span className="font-bold" style={{ color: weakColor }}> ธาตุประจำตัวอ่อนแอ </span>
            เจ้าชะตาต้องอาศัยแรงสนับสนุนจากธาตุเดียวกันและธาตุที่เสริมพลัง เช่น ผู้คนรอบข้าง พันธมิตร
            หรือทรัพยากรที่มั่นคง ก่อนจะออกไปใช้พลังงานกับโลกภายนอก

      <div className="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">

            {s.favorable.map((f) => (
              <span
                key={f.element + f.role}

                {ELEMENT_ZH[f.element]} {ELEMENT_TH[f.element]} · {f.role}
              </span>
            ))}
          </div>
        </div>
        <div>
          <p style={{ fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.15em", color: weakColor, fontWeight: 600 }}>
            ธาตุที่ควรระวัง
          </p>
          <div className="mt-2 flex flex-wrap gap-2">
            {s.unfavorable.map((f) => (
              <span

            ))}
          </div>
        </div>
      </div>

}

function BranchRelations({ pillars, counts, dayMaster }) {
  const dmElement = dayMaster.stemElement;
  const s = computeDayMasterStrength(pillars, counts, dmElement);
  const favEls = new Set(s.favorable.map((f) => f.element));
  const unfavEls = new Set(s.unfavorable.map((f) => f.element));
  const { sanhe, sanhui, sanxing, unrelated } = analyzeBranchRelations(pillars);

  return (
    <div className="relative px-6 py-8 sm:px-10 sm:py-10" style={cardStyle}>
      <p style={label}>ความสัมพันธ์ระหว่างนักษัตร</p>
      <h3 className="mt-2 text-xl font-bold sm:text-2xl" style={{ color: COLOR.heading, fontFamily: "'Noto Serif Thai', serif" }}>

      </h3>
      <p className="mt-3 text-sm" style={{ color: COLOR.muted }}>
        <span className="font-semibold" style={{ color: COLOR.body }}>"刑" (อ่านว่า Xíng)</span> คือคำที่ตำราจีนใช้เรียกนักษัตรบางคู่/บางกลุ่มที่ถือว่า<span className="font-semibold" style={{ color: COLOR.body }}>ขัดแย้ง</span>หรือเสียดสีพลังกัน
        เมื่อนักษัตรเหล่านี้มาอยู่ร่วมกันในดวงชะตา มักสะท้อนความตึงเครียดหรือประเด็นที่ต้องระมัดระวังเป็นพิเศษในเรื่องนั้นๆ
        ต่างจาก "ประสาน" ที่หมายถึงนักษัตรที่ส่งเสริมพลังกัน
      </p>

      {sanhe.length === 0 && sanhui.length === 0 && sanxing.length === 0 && (
        <p className="mt-4" style={bodyText}>
          ในสี่เสาชะตานี้ไม่มีนักษัตรที่ประสานหรือขัดแย้ง (刑) กันเป็นพิเศษ นักษัตรแต่ละตัวจึงทำหน้าที่ของตนเองอย่างอิสระ
        </p>
      )}

      {sanhe.length > 0 && (
        <div className="mt-5">
          <p style={{ fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.15em", color: "#8FE39A", fontWeight: 600 }}>
            สามเหลี่ยมประสาน · ซาฮะ
          </p>
          <div className="mt-3 space-y-3">
            {sanhe.map((g, i) => {
              const relation = favEls.has(g.element) ? "เป็นคุณ" : unfavEls.has(g.element) ? "ควรระวัง" : "เป็นกลาง";
              const relationColor = favEls.has(g.element) ? "#8FE39A" : unfavEls.has(g.element) ? "#F0958C" : COLOR.muted;
              return (
                <div key={i} className="p-4 rounded-sm" style={{ backgroundColor: "rgba(0,0,0,0.35)", border: `1px solid ${COLOR.cardBorder}` }}>
                  <p style={bodyText}>
                    เสา{g.pillars.map((p) => p.label).join(" + ")} ({g.pillars.map((p) => p.char).join("")}) ประสานกันเป็นธาตุ
                    <span style={{ color: ELEMENT_COLOR[g.element] }} className="font-bold"> {ELEMENT_ZH[g.element]} {ELEMENT_TH[g.element]} </span>
                    {g.full ? "แบบเต็มรูป (ครบสามเสา)" : "แบบกึ่งประสาน (มีสองในสามเสา)"} — เท่ากับดวงชะตามีธาตุ{ELEMENT_TH[g.element]}แฝงอยู่มากกว่าที่นับตรงตัว
                  </p>
                  <p className="mt-2 text-sm font-semibold" style={{ color: relationColor }}>
                    ต่อธาตุประจำตัว: {relation} — {relation === "เป็นคุณ"
                      ? `ยิ่งช่วยส่งเสริมดวงชะตาให้เด่นชัดขึ้นในทาง${ELEMENT_TRAIT_TH[g.element]}`
                      : relation === "ควรระวัง"
                      ? "อาจทำให้ธาตุที่ไม่เป็นคุณต่อธาตุประจำตัวมีพลังมากขึ้น ควรใช้สติในเรื่องที่เกี่ยวข้องกับธาตุนี้"
                      : "ไม่ได้ส่งผลด้านบวกหรือลบต่อธาตุประจำตัวโดยตรงมากนัก"}
                  </p>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {sanhui.length > 0 && (
        <div className="mt-5">
          <p style={{ fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.15em", color: "#8FE39A", fontWeight: 600 }}>
            สามนักษัตรร่วมฤดู · 三会
          </p>
          <div className="mt-3 space-y-3">
            {sanhui.map((g, i) => {
              const relation = favEls.has(g.element) ? "เป็นคุณ" : unfavEls.has(g.element) ? "ควรระวัง" : "เป็นกลาง";
              const relationColor = favEls.has(g.element) ? "#8FE39A" : unfavEls.has(g.element) ? "#F0958C" : COLOR.muted;
              return (
                <div key={i} className="p-4 rounded-sm" style={{ backgroundColor: "rgba(0,0,0,0.35)", border: `1px solid ${COLOR.cardBorder}` }}>
                  <p style={bodyText}>
                    เสา{g.pillars.map((p) => p.label).join(" + ")} ({g.pillars.map((p) => p.char).join("")}) อยู่ใน{g.season} ร่วมฤดูกันเป็นธาตุ
                    <span style={{ color: ELEMENT_COLOR[g.element] }} className="font-bold"> {ELEMENT_ZH[g.element]} {ELEMENT_TH[g.element]} </span>
                    {g.full ? "แบบเต็มรูป (ครบสามเสา ถือว่าประสานแน่นกว่าซาฮะ)" : "แบบกึ่งร่วมฤดู (มีสองในสามเสา)"}
                  </p>
                  <p className="mt-2 text-sm font-semibold" style={{ color: relationColor }}>
                    ต่อธาตุประจำตัว: {relation} — {relation === "เป็นคุณ"
                      ? `ยิ่งช่วยส่งเสริมดวงชะตาให้เด่นชัดขึ้นในทาง${ELEMENT_TRAIT_TH[g.element]}`
                      : relation === "ควรระวัง"
                      ? "อาจทำให้ธาตุที่ไม่เป็นคุณต่อธาตุประจำตัวมีพลังมากขึ้น ควรใช้สติในเรื่องที่เกี่ยวข้องกับธาตุนี้"
                      : "ไม่ได้ส่งผลด้านบวกหรือลบต่อธาตุประจำตัวโดยตรงมากนัก"}
                  </p>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {sanxing.length > 0 && (
        <div className="mt-5">
          <p style={{ fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.15em", color: "#F0958C", fontWeight: 600 }}>
            三刑 · ขัดแย้ง
          </p>
          <div className="mt-3 space-y-3">
            {sanxing.map((g, i) => (
              <div key={i} className="p-4 rounded-sm" style={{ backgroundColor: "rgba(0,0,0,0.35)", border: `1px solid ${COLOR.cardBorder}` }}>
                <p style={bodyText}>
                  เสา{g.pillars.map((p) => p.label).join(" + ")} ({g.pillars.map((p) => p.char).join("")}) เข้า 刑 (ขัดแย้ง) กันแบบ
                  <span className="font-bold" style={{ color: "#F0958C" }}> {g.name} </span>
                  {g.full ? "(ครบรูป)" : "(บางส่วน)"}
                </p>
                <p className="mt-2 text-sm" style={bodyText}>{g.meaning}</p>
              </div>
            ))}
          </div>
        </div>
      )}

      {unrelated.length > 0 && (
        <div className="mt-5">
          <p style={{ fontSize: "0.7rem", textTransform: "uppercase", letterSpacing: "0.15em", color: COLOR.gold, fontWeight: 600 }}>
            นักษัตรที่ไม่สัมพันธ์กับใครเป็นพิเศษ
          </p>
          <p className="mt-2 text-sm" style={bodyText}>
            {unrelated.map((it) => `เสา${it.label} (${it.char})`).join(" · ")} ไม่ได้เข้าเป็นสามเหลี่ยมประสาน สามร่วมฤดู หรือ 刑 (ขัดแย้ง) กับนักษัตรอื่นในดวง
            จึงแสดงลักษณะของตัวเองอย่างตรงไปตรงมา โดยไม่ถูกเสริมหรือบั่นทอนจากนักษัตรข้างเคียง
          </p>
        </div>
      )}
    </div>
  );
}

  const pattern = computeSpecialPattern(pillars, counts, dmElement, sanhe, sanhui);

function LuckPillars({ date, gender, pillars, counts, dayMaster }) {

  const dmElement = dayMaster.stemElement;
  const { sanhe, sanhui } = analyzeBranchRelations(pillars);
  const pattern = computeSpecialPattern(pillars, counts, dmElement, sanhe, sanhui);
  const normal = computeDayMasterStrength(pillars, counts, dmElement);
  const favSource = pattern ? pattern.favorable : normal.favorable;
  const unfavSource = pattern ? pattern.unfavorable : normal.unfavorable;

  const natalBranchIdxSet = new Set(pillars.map((p) => BRANCHES.indexOf(p.branch)));
  const { forward, startingAgeYears, periods } = computeLuckPillars(date, gender, pillars);

        {periods.map((p, i) => {
          const { good, bad } = analyzeLuckPeriodSigns(p, natalBranchIdxSet, favSource, unfavSource, pillars);
          const mid = p.ageStart + 5;
          const isExpanded = expandedPeriod === i;
          const liuNian = isExpanded ? computeLiuNianYears(p, birthYear, natalBranchIdxSet, favSource, unfavSource, counts, gender, pillars) : null;

            <div key={i} className="rounded-sm" style={{ backgroundColor: "rgba(0,0,0,0.35)", border: `1px solid ${COLOR.cardBorder}` }}>

                  <div className="flex items-center gap-5">

                      <span className="block text-3xl" style={{ color: ELEMENT_COLOR[p.stemElement], fontFamily: "'Ma Shan Zheng', cursive" }}>

                      <span className="text-[0.65rem]" style={{ color: COLOR.muted }}>
                        บน · {p.ageStart.toFixed(0)}-{mid.toFixed(0)}
                      </span>
                    </div>
                    <div className="text-center">
                      <span className="block text-3xl" style={{ color: ELEMENT_COLOR[p.branchElement], fontFamily: "'Ma Shan Zheng', cursive" }}>
                        {p.branch}
                      </span>
                      <span className="text-[0.65rem]" style={{ color: COLOR.muted }}>

                            <span style={{ color: ELEMENT_COLOR[y.branchElement] }}>{y.branch}</span>

                          <span className="text-xs font-bold" style={{ color: y.verdictColor }}>

                          </span>

                              {y.good.map((g, gi) => (

                                  ✓ {g}
                                </p>
                              ))}
                              {y.bad.map((b, bi) => (
                                <p key={"yb" + bi} className="text-[0.7rem]" style={{ color: "#F0958C" }}>
                                  ⚠ {b}

                              )}
                            </div>

                            <div className="space-y-2 border-t pt-2" style={{ borderColor: COLOR.cardBorder }}>
                              <p style={{ fontSize: "0.65rem", textTransform: "uppercase", letterSpacing: "0.15em", color: COLOR.gold, fontWeight: 600 }}>

                                    {lines.map((l, li) => (

                                  </div>
                                ) : null
                              )}
                              {Object.values(y.domains).every((lines) => lines.length === 0) && (
                                <p className="text-[0.7rem]" style={{ color: COLOR.muted }}>ปีนี้ไม่มีด้านใดที่โดดเด่นเป็นพิเศษ ดำเนินชีวิตตามปกติได้</p>
                              )}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <p className="mt-6 text-xs italic" style={{ color: COLOR.faint }}>
        อายุเริ่มวัยจรและปีจรคำนวณแบบประมาณจากจำนวนวันถึงจุดเปลี่ยนฤดูที่ใกล้ที่สุด (3 วัน ≈ 1 ปี) และใช้ปีปฏิทินแบบง่ายสำหรับปีจร
        ไม่ได้ปรับตามวันลี่ชุนที่แน่นอนของแต่ละปี ผลจริงจากตำรามืออาชีพอาจคลาดเคลื่อนจากนี้เล็กน้อย
      </p>
    </div>
  );

function ElementBars({ counts }) {
  const max = Math.max(...Object.values(counts), 1);
  return (
    <div className="space-y-3">
      {Object.entries(counts).map(([el, count], i) => (
        <div key={el} className="flex items-center gap-3">
          <span className="w-20 shrink-0 text-right text-sm font-medium" style={{ color: COLOR.body }}>
            {ELEMENT_ZH[el]} <span style={{ color: COLOR.muted }}>{ELEMENT_TH[el]}</span>
          </span>
          <div className="h-2.5 flex-1 overflow-hidden rounded-full" style={{ backgroundColor: "#100d0a" }}>
            <div
              className="h-full rounded-full"
              style={{ width: `${(count / max) * 100}%`, backgroundColor: ELEMENT_COLOR[el], animation: `barGrow 0.7s ease-out ${i * 0.08}s both`, transformOrigin: "left" }}
            />
          </div>
          <span className="w-4 shrink-0 text-sm font-semibold" style={{ color: COLOR.body }}>{count}</span>
        </div>
      ))}
    </div>
  );
}
